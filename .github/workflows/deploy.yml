name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm install, not npm ci: the lockfile is generated on Windows and cannot
      # record sharp's Linux-only optional deps, so npm ci refuses to install.
      - run: npm install --no-audit --no-fund

      # Two looks, one codebase — the same source is exported twice, each with
      # its own basePath, and the second is nested inside the first so a single
      # Pages site serves both:
      #   /edward-scissorhands/        the gold-on-black original
      #   /edward-scissorhands/white/  the monochrome variation
      - name: Build the gold theme
        env:
          # At domain cutover: delete this line AND add public/CNAME, together —
          # one without the other 404s every asset.
          NEXT_PUBLIC_BASE_PATH: /edward-scissorhands
          NEXT_PUBLIC_THEME: gold
        run: npm run build

      # next build always writes to out/, so the first export has to move aside
      # before the second one runs.
      - run: mv out site

      - name: Build the white theme
        env:
          NEXT_PUBLIC_BASE_PATH: /edward-scissorhands/white
          NEXT_PUBLIC_THEME: white
        run: npm run build

      - run: mv out site/white && mv site out

      - name: Disable Jekyll
        # Without this Pages drops every directory starting with an underscore,
        # including _next, and the site deploys "successfully" but unstyled.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
